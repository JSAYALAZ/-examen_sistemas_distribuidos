name: CI/CD Pipeline & DevSecOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Unit Test (Fail-Fast)
  # ----------------------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias con npm ci
        run: npm ci

      - name: Ejecutar pruebas unitarias (npm test)
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Security Scan (Trivy) & Push to GHCR
  # ----------------------------------------------------------------------------
  build-push:
    name: Security Scan & Push Image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar motor de compilación Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen local para auditoría de vulnerabilidades
        run: |
          docker build -t local-inventario-app:${{ github.sha }} .

      - name: Escaneo de Seguridad con Trivy (Bloquea en vulnerabilidades CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-inventario-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Autenticación en GHCR (GitHub Container Registry)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas (tags) y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Publicar imagen en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
